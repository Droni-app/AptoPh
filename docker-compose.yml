services:
  postgres:
    image: postgres:17-alpine
    container_name: apartadock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apartadock
      POSTGRES_PASSWORD: apartadock
      POSTGRES_DB: apartadock
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apartadock']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
