# App icon from branding/app-icon (regenerate: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  image_path_ios: assets/branding/icon-ios.png
  remove_alpha_ios: true
  background_color_ios: "#FAF7F2"
  min_sdk_android: 24
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  adaptive_icon_background: assets/branding/icon-background.png
  # Android 13+ themed icons
  adaptive_icon_monochrome: assets/branding/icon-monochrome.png
